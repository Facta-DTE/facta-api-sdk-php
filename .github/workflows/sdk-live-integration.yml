name: PHP SDK live integration (staging API, test environment)

# Issues real $0.01 test documents in environment 00 of the STAGING API with the
# secrets of the `staging-live-test` environment (or organization secrets with the
# same names). A pull request from this repository runs it once it is ready for
# review; a person can run it by hand. It never passes silently: a missing secret
# fails the run with "Required integration input is unavailable: NAME".

concurrency:
  group: sdk-staging-live-php
  cancel-in-progress: false

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: Issue one FE for $0.01, or the full enabled DTE test-fixture matrix
        required: true
        type: choice
        options:
          - skip
          - emit-test-fe
          - emit-enabled-dte-fixtures

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  live-test:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.confirmation == 'emit-test-fe' || inputs.confirmation == 'emit-enabled-dte-fixtures')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: staging-live-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read original workflow run timestamp
        id: run-age
        uses: actions/github-script@v8
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            core.setOutput('created_at', run.data.created_at);
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: "8.3"
          extensions: curl, openssl, zip
          coverage: none
          ini-values: error_reporting=-1, display_errors=On
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Unit tests (including the live script's guards and report, offline)
        run: vendor/bin/phpunit
      - name: Run staging API integration
        run: php scripts/live-integration.php
        env:
          STAGING_FACTA_API_KEY: ${{ secrets.STAGING_FACTA_API_KEY }}
          STAGING_FACTA_SIGN_KEY: ${{ secrets.STAGING_FACTA_SIGN_KEY }}
          # Read and validated, unused until the SDK opens the local vault (tier 2).
          STAGING_FACTA_UNLOCK_KEY: ${{ secrets.STAGING_FACTA_UNLOCK_KEY }}
          STAGING_FACTA_DTE_FIXTURES_JSON: ${{ secrets.STAGING_FACTA_DTE_FIXTURES_JSON }}
          # Optional test inbox for the e-mail delivery check. A reached mail
          # quota or provider outage there is a WARNING, never a failed run.
          STAGING_FACTA_DELIVERY_EMAIL: ${{ secrets.STAGING_FACTA_DELIVERY_EMAIL }}
          STAGING_FACTA_API_BASE_URL: https://eobxzotnqzgtpuqvmpkc.supabase.co/functions/v1/api-v1
          FACTA_LIVE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'emit-test-fe' }}
          GITHUB_RUN_CREATED_AT: ${{ steps.run-age.outputs.created_at }}
          FACTA_LIVE_REPORT_DIR: ${{ runner.temp }}/facta-live-report
      - name: Add live result to pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          RESULT: ${{ job.status }}
          REPORT_PATH: ${{ runner.temp }}/facta-live-report/report.md
        with:
          script: |
            const marker = '<!-- facta-php-sdk-staging-live-result -->';
            const fs = require('node:fs');
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, 'utf8')
              : '';
            const body = [
              marker,
              `## PHP SDK staging live test: ${process.env.RESULT}`,
              '',
              report || 'No invoice report was produced. This run does not establish that an invoice was generated; inspect the failed step in the workflow logs.',
              '',
              `[Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }
