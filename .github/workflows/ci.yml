name: CI

# Runs only on pull requests that are ready for review (not drafts), and by
# hand. A draft PR or a plain branch push spends no Actions minutes; marking the
# PR "Ready for review" starts the run, and every later push to it re-runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        experimental: [false]
        include:
          - php: "8.6"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, zip
          coverage: none
          ini-values: error_reporting=-1, display_errors=On, zend.assertions=1
        env:
          fail-fast: true
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.experimental && '--ignore-platform-reqs' || '' }}
      - name: PHPUnit (deprecations, notices and warnings fail the build)
        run: vendor/bin/phpunit

  no-curl:
    name: Stream transport (no ext-curl)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: "7.4"
          extensions: openssl, zip, :curl
          coverage: none
          ini-values: error_reporting=-1, display_errors=On
      - name: Confirm ext-curl is absent
        run: |
          php -r 'exit(extension_loaded("curl") ? 1 : 0);'
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit

  static:
    name: PHPCompatibility and PHPStan
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: "8.3"
          extensions: curl, openssl, zip
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer compat
      - run: composer phpstan

  zip:
    name: Release ZIP smoke test
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: "7.4"
          extensions: curl, openssl, zip
          coverage: none
          ini-values: error_reporting=-1, display_errors=On
      - name: Build the archive (no Composer install needed)
        run: php scripts/build-zip.php
      - name: Unzip it and run a script that only requires autoload.php
        run: php scripts/zip-smoke.php dist/facta-api-php-v*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: facta-api-php-zip
          path: dist/*.zip
